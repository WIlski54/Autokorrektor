<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}Aufgaben{% endblock %} – Korrektor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="{% block koerperklasse %}{% endblock %}">
  <header class="seitenkopf">
    <a class="marke" href="{{ url_for('seiten.aufgaben') }}">Korrektor</a>
    <nav class="krumen" aria-label="Brotkrumen">
      <ol>
        <li><a href="{{ url_for('seiten.aufgaben') }}">Aufgaben</a></li>
        {% block krumen %}{% endblock %}
      </ol>
    </nav>
  </header>
  <main class="inhalt">
    {% with meldungen = get_flashed_messages(with_categories=true) %}
      {% for art, text in meldungen %}
        <p class="meldung {{ art }}" role="{{ 'alert' if art == 'fehler' else 'status' }}">{{ text }}</p>
      {% endfor %}
    {% endwith %}
    {% block inhalt %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block skripte %}{% endblock %}
</body>
</html>
